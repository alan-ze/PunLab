[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spp"
version = "0.1.0"
authors = [{ name = "Alan", email = "alanzenh@gmail.com" }]
description = "Data science pipeline for SPP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "openpyxl>=3.1.5,<4",
    "xlsxwriter>=3.2.9,<4",
    "tqdm>=4.66"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"] 

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --cov=spp"