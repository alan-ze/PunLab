[workspace]
authors = ["Alan <alanzenh@gmail.com>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]
name = "SPP"
version = "0.1.0"

[dependencies]
python = "3.10.*"

[pypi-dependencies]
spp = { path = ".", editable = true }
matlabengine = "==24.2.*"

[feature.dev.dependencies]
ruff = ">=0.9.0"
pytest = ">=8.0.0"
pytest-cov = ">=5.0"

[environments]
default = ["dev"]  # pixi run test
prod = []  # pixi run -e prod run_pipeline

[tasks]
run_pipeline = "python scripts/run_pipeline.py"
test = "pytest"
lint = "ruff check --fix ."
format = "ruff format ."
check = { depends-on = ["lint", "test"] }

