[workspace]
authors = ["Alan <alanzenh@gmail.com>"]
channels = ["conda-forge"]
name = "SPP"
platforms = ["win-64"]
version = "0.1.0"

[dependencies]
python = "3.10.*"
openpyxl = ">=3.1.5,<4"
xlsxwriter = ">=3.2.9,<4"

[pypi-dependencies]
spp = { path = ".", editable = true }
ruff = ">=0.9.0"
pytest = ">=8.0.0"
pytest-cov = ">=5.0"
matlabengine = "==24.2.*"

[tasks]
run_pipeline = "python scripts/run_pipeline.py"
test = "pytest"
lint = "ruff check --fix ."
format = "ruff format ."
check = { depends-on = ["lint", "test"] }
