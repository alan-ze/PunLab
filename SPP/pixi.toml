[workspace]
name = "spp"
version = "0.1.0"
authors = ["Alan <alanzenh@gmail.com>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.10.*"
numpy = ">=2.0,<3"
pandas = ">=2.2,<3"

[pypi-dependencies]
spp = { path = ".", editable = true }
matlabengine = "==24.2.*"

[feature.dev.dependencies]
ruff = ">=0.9.0"
pytest = ">=8.0.0"
pytest-cov = ">=5.0"
ipykernel = "*" 

[environments]
default = ["dev"]  # pixi run run_pipeline
prod = []  # pixi run run_pipeline --env prod

[tasks]
run_pipeline = "python scripts/run_pipeline.py"
test = "pytest"
lint = "ruff check --fix ."
format = "ruff format ."
check = { depends-on = ["lint", "test"] }
process-data = "python scripts/run_pipeline.py"