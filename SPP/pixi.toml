[workspace]
authors = ["Alan <alanzenh@gmail.com>"]
channels = ["conda-forge"]
name = "SPP"
platforms = ["win-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.10.*"
pandas = ">=2.3.3,<3"
numpy = ">=2.2.6,<3"

[pypi-dependencies]
ruff = ">=0.14.11, <0.15"
pytest = ">=9.0.2, <10"

[tasks]
# Run tests
test = "pytest"

# Run linter (fix mode)
lint = "ruff check --fix ."

# Format code
format = "ruff format ."

# Run everything before committing
check = { depends-on = ["lint", "test"] }