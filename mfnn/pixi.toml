[workspace]
name = "mfnn"
version = "0.1.0"
authors = ["Alan <alanzenh@gmail.com>"]
channels = ["conda-forge", "bioconda"] 
platforms = ["win-64", "linux-64"]

[dependencies]
python = "==3.11.7"
numpy = "==1.26.4"
pandas = "==2.1.3"

scipy = ">=1.13"   
scikit-learn = ">=1.5"
matplotlib = ">=3.9"

[pypi-dependencies]
mfnn = { path = ".", editable = true }
tensorflow = "==2.15.0"

[feature.dev.dependencies]
ruff = ">=0.9.0"
pytest = ">=8.0.0"
pytest-cov = ">=5.0"
jupyterlab = "*"
ipykernel = "*"
ipywidgets = "*"   

[environments]
default = ["dev"]
prod = []

[tasks]
notebook = "jupyter lab"
test = "pytest"
lint = "ruff check --fix ."
format = "ruff format ."
check = { depends-on = ["lint", "test"] }